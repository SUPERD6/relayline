# ccx 分级配置：按任务难度选模型和推理强度。
# 原则：能自己两三步做完的不派（T0）；派出去时用"能做好的最便宜一档"；
# 失败或卡住才升一级（最多升 max_escalations 次）。
#
# 模型名核对来源（2026-10-22）：
#   OpenAI "Using GPT-6" 文档：gpt-6-astra（最强）、gpt-6.1-sol（平衡）、gpt-6-luna（最快最省）
#   gpt-6.1-sol 支持 reasoning effort：low / medium / high / xhigh / max
#   Claude Code CLI 2.1.309：--model 接受别名 haiku / sonnet / opus / fable，--effort 接受 low/medium/high/xhigh/max
# 模型会更新，改这里即可，代码不用动。用户覆盖文件：<hub>/ccx/tiers.toml（同结构，只写要改的键）。

[defaults]
auto_escalate = true      # 子任务返回 blocked/failed 时，在同一会话里换更强一档继续（续接上下文，不重新喂背景）
max_escalations = 1
focused_retry = false     # 说做完了但 --check 没过时，下一次（同一家）续同一会话，带上失败的命令和约 2000 字的输出，只修失败处；
# false = 照旧（升档提示 + 400 字）。r6a 里这类重试中位 389 s、比首轮还慢；默认关，等一轮实测确认不降正确率再开
max_parallel = 3         # batch 并行上限
max_depth = 1             # 子智能体不能再派子智能体，防止套娃烧 token
timeout_sec = 1800
tradeoff = "save"         # 省钱 save | 平衡 balanced | 快 fast | 最便宜 cheapest（见下面 [policy.*]），或 0..1 的旋钮（0 最省，1 最快）；ccx config set defaults.tradeoff 0.3
# save：小活先用便宜模型，没做成（含 ccx 重跑 --check 没过）就自动升一档。2026-10-25 起默认；之前是 balanced，
# 七核心 A/B（PR #30）里它在 5 分钟的小活上选 sonnet medium，比 luna low 贵约 10 倍，luna low 那时 55/63 做对。
ab_self_rate = 0.1        # 约 10% 的可派任务让主导自己做，用来实测“到底省了多少”（0 = 关）
namecheck = "warn"        # 写入运行后，静态查改动过的函数里有没有未定义的名字（ccx/namecheck.py，标准库，毫秒级）：
# warn = 命中写进记录、给主导的结果和评审简报，作为弱证据，不判失败（默认）；fail = 命中算验收失败（check_failed）；
# off = 不查。也可 ccx run --namecheck；手动查用 ccx namecheck。默认 warn 的依据：本仓库、标准库 0 误报，r5 的
# 3 万多个文件里唯一命中是真 bug，没命中时没有代价；有命中的运行不自动记“大概率对”。换成 fail 要等 r5 前后对比。

# 整个流程的档位（task-routing 的 tier_plan，docs/DECISIONS.md「档位」）：--tradeoff save|balanced|fast|cheapest
# 不只选模型，还决定每块活谁做：self = 主导自己做；ccx2 = 交给 ccx、主导验收（模型按 save 选）；
# direct = 交给 ccx、没人复核（标“可能做错”，适合脚本/CI）。
# 预先授权只来自用户自己的设置 picked（`ccx config set policy.picked balanced`，none = 关）：设了以后，用这一档的
# ccx propose 按档位直接派（authorized: true，一个提议只管一次运行，L0/L1 改文件前仍要问）；picked 只改谁做、
# 不改选模型（不带 --tradeoff 的运行仍按 defaults.tradeoff 选）。主导传的 --tradeoff 只是选模型、不授权，
# 仍是“先提议一句”，A/B 和试验照旧。分档：文件数、分钟数、简报长度任一项达标即算；两项估计都没给 = 拿不准。
# 默认档仍是上面的 defaults.tradeoff（save），等确认实验定了再改。分档阈值是从第 5 轮看出来的暂定值。
[policy]
picked = ""               # 空 = 没选档（默认）：和以前一样先提议

[policy.bands]
large_files = 3           # 大：改 >= 3 个源文件，或估计 >= 45 分钟，或简报 >= 180 词（中文按字数 / 2.5）
large_minutes = 45
large_words = 180
medium_files = 2
medium_minutes = 15
medium_words = 80
cjk_chars_per_word = 2.5
lead_ctx_large = 150000   # balanced：主导上下文到这么多 token 时，中任务也交给 ccx2
knob = [0.34, 0.67]       # 0..1 旋钮：低于第一个 = save，低于第二个 = balanced，否则 fast
# 状态机、续跑/恢复/kill 这类新机制：balanced 下留给自己做（q-resume-session：ccx2 8/10，direct 2/6，self 2/2）。
# 英文按整词匹配（skill 不算 kill，traceback 不算 race），中文按原样匹配
hard_words = ["state machine", "state-machine", "resume", "kill", "restart", "crash", "race",
              "状态机", "续跑", "恢复", "中断", "杀掉"]

[policy.save]             # 全交 ccx2；拿不准也交
small = "ccx2"
medium = "ccx2"
large = "ccx2"
uncertain = "ccx2"
hard = "ccx2"

[policy.balanced]         # 小、中自己做，大的交 ccx2；拿不准、状态机类自己做
small = "self"
medium = "self"
large = "ccx2"
uncertain = "self"
hard = "self"
medium_big_ctx = "ccx2"

[policy.fast]             # 全部自己做
small = "self"
medium = "self"
large = "self"
uncertain = "self"
hard = "self"

[policy.cheapest]         # 不经主导验收，结果标“可能做错”
small = "direct"
medium = "direct"
large = "direct"
uncertain = "direct"
hard = "direct"

# 总开关（P0-9）：auto = 照常路由和派活；off = ccx 不派新活，ccx route / ccx propose 一律"自己做"，ccx run / batch / q run /
# q resume / way 不带 --force 就拒绝；只当跨厂商审查和对话用：ccx ask、ccx discuss、ccx run --mode read、mem、board，
# 以及已开始运行的 ccx resume 照常。
# 小活自己做（P0-6，默认关，等留出集一轮实测再开）：开了以后 ccx route / ccx propose 在"自己做比派活的固定开销便宜"时
# 建议 do it yourself，不再提议派；ccx run 照派、rung 照算。small_self_by = files（默认）= #200 的规则；cost（实验）：自己做的成本 = 请求数（--requests，
# 否则 self_requests_base + self_requests_per_file × 文件数）×（主导会话当前长度，读不到用 self_ctx_default + 读进的文件）
# × 缓存读价 + 读进的文件写缓存 + 少量输出，低于 small_self_overhead_usd（主导写 brief + 等 + 验收，pg1 账本中位数 $0.035，
# 按主导模型价格缩放，再加会话更长时那约 3 次请求多读的部分）就自己做；files：--files <= small_self_files。
# 选了档位（policy.picked）、--needs 要 ccx 才有的东西、主导上下文 >= policy.bands.lead_ctx_large、主导额度 >= small_self_quota
# 时不生效。依据：pg1 派活花费 82% 在主导侧；hc1 / pg1 self 账本校准（一个文件 3–4 次请求、每次约 25k token）。
[routing]
mode = "auto"             # ccx config set routing.mode off
small_self = false        # ccx config set routing.small_self on
small_self_by = "files"   # files（#200 的规则，默认）| cost（实验：自己做贵不贵）
small_self_overhead_usd = 0.035
small_self_overhead_requests = 3        # 派活时主导自己的请求数（pg1 ccx2 中位），开销常数按它在你会话上的价钱缩放
small_self_overhead_on = "claude:sonnet"  # 开销常数是在哪个主导上量的
small_self_files = 1
small_self_quota = 0.9
self_requests_base = 2
self_requests_per_file = 1.5
self_ctx_default = 25000
self_tokens_per_file = 3000
self_output_per_request = 100

[lead]                    # 主导平时用的模型：估算“如果自己做要花多少”；lead.model_by_task 开时也是“强档”的名字（强档不传 --model，工具照常用自己的模型）
claude = "opus"
codex = "gpt-6.1-sol"
model_by_task = false     # 按任务选主导模型（默认关）：ccx 新开/推荐一个新的主对话时按难度选，见 [lead_by_task]

# 按任务选主导模型（lead.model_by_task = true 才生效）。只用在“新开一个主对话”的地方：ccx fresh、ccx handoff、
# ccx route / propose 给的 new_lead（以及主导自己的内置子智能体的 builtin_model）。正在跑的对话永远不换模型
# （换了整段提示缓存作废）。难度 b 和 ccx route 同一个（b = log2 分钟）：b <= easy_max_b 用 easy 里的模型，
# 更难或 risk = hard_risk 用上面 [lead] 的模型（不传 --model，按你平时的模型开）；easy 里没写的工具一律用 [lead] 的。
# 阈值是暂定值，等 scripts/eval/r5.py --lead-model auto 和固定 opus / sonnet 比过再定（auto 若按参考答案的改动大小
# 估难度，只是上限，不能拿来决定开关）。
[lead_by_task]
easy_max_b = 4.0          # 约 16 分钟以内的活
hard_risk = "critical"

[lead_by_task.easy]
claude = "sonnet"

[projects]                # 项目目录（ccx projects / ccx where）：在这些根目录下找项目，目录只存在本机 hub
roots = []                # 默认空；ccx config set projects.roots "DIR;DIR"
max_depth = 5             # 根目录往下最多找几层
refresh_hours = 24        # 开局时目录比这更旧就在后台轻量刷新（0 = 关）

[report]
publish_dir = ""          # 你的私有用量仓库的本地克隆；ccx report --publish 提交到这里

[tiers.T0]
label = "自己做"
when = "两三步就能完成、只改一两处、或说明任务比做任务还长。派出去的开销（写简报+对方读仓库）比直接做更贵。"
delegate = false

[tiers.T1]
label = "机械活"
when = "改名、格式化、补注释/类型、按明确规则批量替换、样板代码、总结日志、查找定位。"
codex  = { model = "gpt-6-luna",  effort = "low" }
claude = { model = "haiku",       effort = "low", lean = true }
gemini = { model = "flash-lite",       effort = "default" }
dsh    = { model = "deepseek-flash", effort = "low" }
# lean = true：子任务不加载 MCP 工具定义（--strict-mcp-config），机械活用不到，省输入 token。
# gemini 用别名 flash-lite / flash / pro：Gemini CLI 自己解析成当前最新的型号，不用在这里写死版本号。
# Gemini CLI 没有推理强度参数，effort 只做记录。

[tiers.T2]
label = "常规开发"
when = "单个功能、复现清楚的 bug、补测试、单模块小重构、写脚本。"
codex  = { model = "gpt-6.1-sol", effort = "medium" }
claude = { model = "sonnet",      effort = "medium" }
gemini = { model = "flash",       effort = "default" }
dsh    = { model = "deepseek-flash", effort = "high" }

[tiers.T3]
label = "困难"
when = "跨多个文件/模块、原因不明的 bug、性能问题、需要先读懂较大代码库再改、方案设计。"
codex  = { model = "gpt-6.1-sol", effort = "high" }
claude = { model = "opus",        effort = "high" }
gemini = { model = "pro",       effort = "default" }
dsh    = { model = "deepseek-flash", effort = "max" }

[tiers.T4]
label = "关键/研究级"
when = "架构决策、安全审查、并发/正确性证明、新算法、出错代价很高的改动。"
codex  = { model = "gpt-6-astra", effort = "xhigh" }
claude = { model = "opus",        effort = "max" }
gemini = { model = "pro",       effort = "default" }
dsh    = { model = "deepseek-v4-pro", effort = "max" }
# dsh = DeepSeek 官方的 DeepSeek Harness（无头模式），按 token 付真钱；只在 --to dsh 时用，不参与自动选择和换边。

# 权限：read = 只读分析；write = 可以改文件。
[permissions.codex]
# 用 -c sandbox_mode=...，因为 `codex exec resume` 不接受 -s，用同一写法新开和续接都能用。
read  = ["-c", "sandbox_mode=\"read-only\""]
write = ["-c", "sandbox_mode=\"workspace-write\""]

[permissions.claude]
# dontAsk：没被允许的工具一律拒绝，不会卡在等人点"允许"。
read  = ["--permission-mode", "dontAsk", "--allowed-tools", "Read Grep Glob Bash(git status:*) Bash(git diff:*) Bash(git log:*) Bash(ls:*)"]
write = ["--permission-mode", "acceptEdits", "--allowed-tools", "Read Grep Glob Edit Write Bash(git:*) Bash(python:*) Bash(pytest:*) Bash(npm:*) Bash(node:*)"]

# Claude 子智能体的启动开销（实测 2026-10-23，haiku）：默认约 4.6 万 token，每次启动还会重新写入约 9.6k 缓存。
# 只给 6 个工具 + 把“当前目录/git 状态”这类每次都变的段落移出系统提示后：第一次请求约 1.36 万 token（只读 4 个工具约 1.06 万），
# 一小时内再次启动只新写入约 650 token，其余读缓存（0.1 倍价格），而且跨项目也能复用。
[claude_subagent]
tools_write = "Read,Grep,Glob,Edit,Write,Bash"   # 只加载这些内置工具的定义（--tools）
tools_read  = "Read,Grep,Glob,Bash"
exclude_dynamic = true   # --exclude-dynamic-system-prompt-sections：系统提示不随目录变，缓存可跨项目复用
mcp = false              # false = 不加载 MCP 工具定义（--strict-mcp-config）；需要 MCP 时设 true 或 ccx run --mcp
skills = true            # false = 不加载技能列表（--disable-slash-commands）；T1 这类 lean 档位总是关闭

[subagent]
# 实验性开关（B3，docs/features.zh.md「实验性：子智能体精简开关」）：子智能体启动时加载什么。默认都是今天的做法，
# 等前后对比（scripts/eval/r5.py 的 ccx2daily* 组）证明正确率不降再改默认。只管 ccx 派出去的子智能体，不碰主导。
# 和 [subagents]（子智能体自己再开子智能体的花费上限）不是一回事。每次运行用了哪些记在 run.json 的 subagent_switches。
# experimental（实验性）：2026-10-31 实测后三个都保持下面的默认值，精简的一侧都不开，见
# docs/research/2026-10-31-b3-lean-switches.zh.md：codex_memories = false 结论 Unknown；clean = true 结论 Fail
# （留出集输 3 对）；codex_lean_tools = true 按登记规则 Fail（做对 29 对 30），事后解读为未定。
codex_memories = true     # experimental（false 一侧实测 Unknown）。false = 每一档 Codex 都加评测隔离用的那三项 -c（features.memories / memories.use_memories /
# memories.generate_memories = false），只关 memories；不加 --ignore-user-config（那会连 provider、sandbox 设置一起丢）
clean = false             # experimental（true 一侧实测 Fail）。true = "干净"子智能体：Codex/dsh 的 HOME 换成 hub 里每次运行一个的空目录（只少了 ~/.agents/skills；
# CODEX_HOME 不变，所以 ~/.codex 的 AGENTS.md、skills、memories 照常加载；登录、git 配置、rustup/cargo 等位置固定在原处）；
# Claude 加 --disable-slash-commands 和 --setting-sources project,local（不加载用户 settings 和技能；MCP 仍按 --mcp / mcp 设置）；
# 提示里加一句"结果用任务描述的语言写"；Claude 的 Agent 工具只在 --parallel 时才给；--fork 运行不受影响。可能丢掉个人技能带来的正确率
codex_lean_tools = false  # experimental（true 一侧按规则 Fail、事后未定）。true = 写入任务（不含只读/调研）的 Codex 关掉用不上的工具：-c web_search="disabled"、
# --disable image_generation、--disable goals，直连 OpenAI 时再加 --disable apps/plugins（codex-cli 0.164.0 核对过）。
# 只读任务保留网页搜索；要查最新文档的写入任务会受影响

[subagents]
# 子智能体自己再开子智能体（--parallel 时才会让它开）。花费上限 max_usd 默认 2 美元（代码里，ccx/subagents.py）。
# fork_turns：Codex 子智能体开的子会话带不带它自己的对话历史（codex-cli 0.164.0 的 spawn_agent 参数）。
# "all" = 照旧（工具默认，什么都不加）；"none" = --parallel 的提示里多一句：用 fork_turns="none" 开子会话，并把文件、目标、约束、
# 怎么检查都写进给它的消息。每个子会话的请求少带一段历史（估计每个子会话省 25–35k）；可能缺上下文，由父会话复查兜底。
# 只对 Codex 有效（Claude 的 Agent 工具本来就不带父对话）。默认 "all"：等 M3（6 题 × all/none × 2 轮）证明做对不降再开。
fork_turns = "all"

[sessions]
# 子智能体会话什么时候归档（Codex：codex archive；Claude：把记录挪到 ccx-archive，可恢复）：
# after_run = 结果确定就马上归档（做完且验收过：--check 通过或它自己检查过；或已经 ccx verify 判过对错）。
#             还可能续跑的不归档：额度/超时/被停/被杀/blocked/验收失败；--seat 岗位、讨论、审查也不动。
#             之后 ccx resume 或 1 小时内自动续接到它时，ccx 先把它取回来（codex unarchive / 挪回记录）。
# hours     = 只在开局时归档结束超过 auto_archive_hours 小时的（旧做法）
# off       = 不自动归档
archive = "after_run"
# after_run 和 hours 下：开局时还会把结束超过这么多小时的会话补归档。0 = 不按小时补归档。
auto_archive_hours = 2

[board]
# 对话板（docs/board.zh.md）：开着的 Claude Code / Codex / DeepSeek 会话在 .ccx/board.jsonl 互相留言。
# 同一话题里机器之间最多连续这么多条，之后要有人类发言（在某个会话里自己打一轮，或在终端 ccx say）。
max_machine_turns = 6
# 跨电脑后备：你自己的**私人** GitHub 仓库 owner/repo（ccx config set board.github ...）。空 = 关，完全不碰网络。
# ccx 检查它是私人的、不是项目本身的仓库；对话板同步到该仓库的一个 issue，最多每 10 分钟拉一次。
github = ""

[run]
# 一次派活（含升级重试、审查、修复轮）累计花到这么多（API 等价美元）就停，收据写"budget cap reached"；0 = 不限（默认）。
# 每次可用 ccx run/resume --max-usd 覆盖（只有 run/resume 读它）。正在跑的那一步不会被中途掐断：在两步之间检查，
# 所以最多超出一步（一趟尝试，或一次审查）。
max_usd = 0

[wake]
# 后台派活（ccx run --bg）跑完时主动告诉主导一行结论，主导不用轮询（ccx/wake.py）：Claude Code 主导走它自己的收件箱
# （跨会话消息，ccx 后台进程继承了它的 CLAUDE_CODE_MESSAGING_SOCKET），否则留给下一轮的钩子。主导正用 --wait 等着时不发。
enabled = true
# true：已投进 Claude Code 收件箱的就不再给钩子留一份；false：也留一份（被暂存或过期的消息下一轮仍能看到，代价是可能看到两次）
trust_socket = true

[shared_context]
# 共享工作上下文（docs/shared-context.zh.md）：ccx 用代码从主导会话记录里摘“最近在聊什么”，不调模型。
# 派活时附上：auto = 只给可写任务；on = 所有任务；off = 不附（ccx run --context 每次可改）。
run = "auto"
max_chars = 5000          # 英文约 1.2k token；中文 5000 字约 2.2–3k token
# 每轮 hook（ccx turn）里加一行“另一家刚做了什么”；false = 关
turn = true
# 去重（B3 第 9 项，默认关）：true = “已经定下的事”里，从上面某条“这个人要求”切出来的同一句不再重复（主导后来重申的保留）。只删重复，不裁别的
# （这个块带来的“一次做对”36/36 对 7/36，裁剪碰不得）。运行记录的 shared_context 里写估算 token（est_tokens）和删了几句。
# 等 M5（重跑 10-25 那组 A/B 的 6 题 × 关/开 × 2 轮，一次做对不降）再开。
dedupe = false            # 布尔值（true / false），写成字符串 "true" 按关处理

[lanes]
# 热车道（ccx/lanes.py）：同一项目、同一家、同一读写模式的小活，不再每块开一个新子会话（Codex 每次运行输入约 9.3 万 token，
# 第 2 轮实测；不是一次性启动开销，而是约 1.8–2.5 万的固定前缀每次请求重发、一次运行约 5 次请求），而是最多 N 个会话按顺序做，后面的块像 ccx resume 一样续在同一会话里。每块仍是单独的 ccx 运行：
# 单独 --check、单独记账、单独可 undo（worktree 里每块一个提交）。某块失败、会话太长时下一块开新会话。
# 默认关（0）：开不开由实测（确认实验）决定；H11 试用已于 2026-10-26 作废。单次打开：ccx batch --lanes 2 / ccx q run --lanes 2。
default = 0
max_tokens = 200000     # 车道里某一块用的 token（新读 + 缓存读 + 写）到这么多，说明会话太长、每块都要重读一大段，下一块换新会话
max_blocks = 5          # 一个会话最多做这么多块，再换新会话

[merge]
# 合并小块（B3 第 5 项，ccx/merge.py）：ccx batch --merge 把同一目录、同一家、同一模型档、同一读写模式（只合并写入块）、
# 写了估计（minutes <= piece_minutes，没写的不合并）、声明的路径（paths）不重叠的小块合成一次运行，一组最多 max_pieces 块、合计 <= total_minutes。
# 之后逐块判定：有 check 看 check，没有看它自己那行 [id] done|partial|failed，都没有标 unconfirmed；没做完的同会话修一次，再不过单独跑（照常升档）；
# 额度/登录/停止/超时等停下时不再起运行。整组不升档、不开子智能体。默认关：等 M4（6 组 × 合并/不合并 × 3 轮）证明做对不低于逐块跑再说。
default = false
max_pieces = 5
piece_minutes = 5
total_minutes = 15

[memory]
# 共享记忆（docs/DECISIONS.md 的 L1–L3）。ccx mem search 已按 BM25 排序（少见的词权重高，不要求每个词都出现）。
# by_kind = true：按类决定带什么——开局只推“偏好、约束”，简报带相关的“坑、事实、其他”（按 BM25 挑），
#   “事件”只能搜到。默认 false：开不开由实测（确认实验）决定；H11 试用已于 2026-10-26 作废。
# start_scene = true：开局再带当前项目的场景块（先 ccx mem compact --by project 生成）。默认 false。
by_kind = false
start_scene = false

[autonomy]
# 总管自动档位（K4，docs/DECISIONS.md）：总管用 ccx run --project（或带 --autonomy）派活时按档位行事。
# L0 = 只给建议：说打算派什么、怎么派、预计花多少，不派；
# L1 = 只读的活自己派；可能改文件的先停下，等人点头后带 --approved 再派（默认）；
# L2 = 读写都自己派；改动在 --worktree 里、--check 过了、另一家审查 pass、改动小，并且这个项目允许合并时，
#      把那条分支合进项目当前的工作分支。受保护的分支（下面的 protected 和 origin 的默认分支）永远不自动合并。
# 按项目改：ccx autonomy set L2 --project 名字 [--auto-merge on]（存在本机 hub）；
# 项目自己的 .ccx/autonomy.toml 里写 level = "L0" 只能把档位调低，不能调高。单次：ccx run --autonomy L0。
# 无论哪一档都要问人：外发、合进主分支、花钱超上限（daily_usd、--budget、ccx way --risk critical、ccx discuss）、科研审批。
level = "L1"
max_lines = 80          # L2 自动合并的上限：改动行数（加 + 删，含新文件）
max_files = 5           # 和文件数
protected = ["main", "master", "trunk", "release/*"]

[hooks]
# 开局 hook（ccx mem delta）和每轮 hook（ccx turn）最多跑这么多秒；超时就什么都不输出、退出码 0，
# 在 hub 的 ccx/hook-timeouts.jsonl 记一行（命令、用时、在哪一步），ccx doctor 显示最近次数。0 = 不限。
timeout_s = 2.0

[escalate]
# P0-8：ccx 的 check 通过了，但它跑的测试文件全是子智能体这次新写或改过的（收据里 kind = ok_self_checked，标“检查依据由子智能体自写，
# 未经独立验证”；这个标记总是打，不受下面开关影响）时怎么办：
# "review"（默认）= 一定交给独立审查（不占 weak_daily、weak = false 也审），审查简报要求对照任务原文逐条核对名字、签名、参数顺序、
#   返回值、异常和列出的情形；"rung" = 还有更强一档时先升一档重做（同一会话，告诉它“检查只跑了你自己的测试”），最后结果仍按 review 审；
# "off" = 只打标记。--review off 和 [review] mode = "off" 仍优先（那时根本不审）。审查找出问题时照常有一轮修复
# （fix_rounds），修完仍有问题记 review_failed（退出码 2）——原来不审直接退 0 的运行可能因此变成 2。
# 只改了 import / 文件头的既有测试文件不算“自写”（删改了断言或测试函数的才算）。审查按任务原文核对并通过时，
# 标记保留，但不再要 needs_lead，可以被自动判“大概率对”、按 after_run 归档。
# 默认 review 的理由：一次审查约 $0.005（另一家最便宜一档，不含修复轮），升一档重做要再跑一遍整个任务；
# #212 的 rubric 本来就是“对照任务原文、子智能体写的测试不算证据”，正好对上。pg1：check 全是子智能体自写的 test_own.py，
# 30/30 通过，其中 18 道隐藏测试失败；收据误报审计 8 个“说 ok 其实错”里 7 个是跑了子智能体改过的同名测试。
on_self_checked = "review"

[review]
# 独立审查（提案 F1）：子任务改完文件后，由另一家的便宜模型对照任务说明审一遍改动，只回“通过 / 有问题 + 在哪”。
# auto = 只在 --risk visible/critical、代码改动 ≥ min_lines 行、子智能体自己说没把握（open_questions）、或它说改的文件和实际改动对不上时审；
# on = 每次改了文件都审；off = 不审（ccx run --review 可以单次覆盖）。有问题时交回原会话改一轮，再审一次。
mode = "auto"
min_lines = 50        # auto 时：代码（不含 .md 等文档）改动达到这么多行也审；0 = 不按行数触发
weak = true           # auto 时：证据弱也审一次，只用另一家最便宜的一档。弱 = 没有 --check；--check 不跑测试（只 lint / import / exit 0）；
                      # 它跑的测试没提到改动的代码文件或改动的公开函数；或这条验收命令放过过做错的结果。不需要历史。
                      # --check 跑了测试、测试点名了改动的文件和函数、并且通过 = 强证据，不审（七核心 r2：审查把 33/36 提到 36/36，每任务 +$0.004）
weak_daily = 20       # 上面这种审查每天最多几次（约 $0.005 一次）
fix_rounds = 1        # 0 或 1（更大按 1 算）：第 5 轮评测里多轮修改更慢，也没让结果更常做对
# 修复轮的复审："full"（默认）= 和首轮一样审完整改动；"focus" = 仍给完整改动，另附首轮问题和“只看修复”的 diff，
# 先逐条判首轮问题是否已解决，再查新问题（完整改动超过 max_diff_chars 时只给修复部分）。默认关：回放第 5 轮 40 次复审，
# 中位只省 2.4 s，[must] 漏得比 full 多（24 vs 21/33），见 docs/DECISIONS.md。focus 不附 [review] context 的“改动附近的代码”，
# 已修好的首轮问题不单独写一行（不是逐条写“已解决/未解决”）。
fix_rereview = "full"
# P1-10：审查员按任务原文看测试覆盖——逐条要求看验收命令跑的测试有没有真测到它，子智能体自己写或改的测试不算证据，
# 只是缺测试仍算 [note]；brief 里列出验收命令跑了哪些测试文件、哪些是子智能体新写/追加/改过的。false = 回到旧的那句话（A/B 用）。
coverage_rubric = true
# P1-10（实验性，默认关）：ccx 的 check 已通过时，审查的 [must] 必须在条目里写 `repro: <命令 / 输入和错误结果 / 失败的测试>`。
# "downgrade" = 没写的降为 [should]，不判 review_failed、不开修复轮；"confirm" = 全部 [must] 都没写时，先让 also 列表里一位更强的审查员
# 确认一次（多花一次审查钱），之后仍没写的同样降级。false = 关。离线估算（verdict-audit 记录里找得到的 27 个"check 过 +
# review_failed"单元，按宽口径判断有没有复现）：downgrade 最多去掉假阳性 13/25（上限：当时没要求写复现），
# 真阳性只有 2 个、保住 1 个，结论未定，所以 confirm 一起测。改过既有测试、check 被标 weak、(d) 安全类和改断言的 [must] 不套这条。
must_needs_repro = false
max_diff_chars = 12000
# true：审查简报在 diff 后附“改动附近的代码”（改动的函数全文、它们调用的定义、点名它们的测试），占 diff 用剩的 max_diff_chars。
# 默认关：回放第 5 轮录下的 10 次审查（每种提示约 43 遍，scripts/eval/review_replay.py，只测了 claude haiku），用时和输出 token 约减半，但已知真 bug 的 28 次尝试只抓到 11 次（不附时 19，旧提示 15）。
context = false
# 审查者是 Claude 时它的提示缓存时长（Claude Code 的 promptCacheTtl："5m" 或 "1h"；需 2.1.242+，2026-10-26 按官方文档核对）。
# 默认空 = 不设，由 Claude Code 自己定（订阅额度内 -p 运行是 1 小时）。审查是一次性会话、不会续跑，1 小时的缓存写入更贵却用不上；
# "5m" 只作用于 ccx 的审查者，主会话和干活的子任务不受影响。默认关，A/B 量过再说。
cache_ttl = ""
# 审查者默认：已安装、另一家厂商（I3），先用它 T1 那一档（最便宜），再用选模型算出的“简单只读”那一档（提案 I4）。
# 七核心 A/B（PR #30）里按数据选成了 sonnet medium，一次的花费是被审的活的 20–40 倍，通过率没提高。
# 想固定某家的审查者就在这里写，例如 by = { codex = "claude:haiku:low" }（写了的排在最前）。
by = {}
# 审查没能完成（2026-10-24 实测：haiku 两次因输出太长、结构化输出重试用完而失败）时，换下一个另一家的模型再审一次
also = ["claude:sonnet:medium", "codex:gpt-6-luna:high"]

[permissions.gemini]
# plan = 只读；auto_edit = 自动批准改文件（命令行工具仍需批准，无头模式下会被拒绝，比 yolo 安全）。
read  = ["--approval-mode", "plan"]
write = ["--approval-mode", "auto_edit"]

[permissions.dsh]
# dsh 0.2.1-rc.3 没有权限参数：ccx 用环境变量 DSH_PERMISSION_MODE（read-only / workspace-write）给，这里不用加参数。
read  = []
write = []

[pay_per_token.dsh]
daily_usd = 1.0   # dsh 用你的 DEEPSEEK_API_KEY 按 token 计费；每天最多花这么多美元

# 模型来源（provider）：同一个 CLI 换一个 API，当作一个单独的智能体（自己的档位、价格和学习）。
# 用法：ccx run --to deepseek --model deepseek-flash "..."（或 --provider deepseek）；自动选模型时，它花的真钱和订阅额度的隐形价格比（额度用到 60% 以上隐形价格开始上涨，所以额度越紧它越常胜出；没有额度门槛），每天仍受 daily_usd 限制。
# 值以 $ 开头的从你的环境变量读取，ccx 不保存任何密钥；没设这个变量的 provider 不参与任何选择（ccx agents 里 ready = false）。
# 每家都有 daily_usd（每天最多花多少美元，到了就不再派给它）。模型没有价格时 ccx 算不出花费，上限就守不住，所以拒绝运行：
# 价格写在 priors 的 [model_prices]，或这里的 prices."<模型>" = { input = .., cached = .., output = .. }（美元 / 百万 token）。
# 只有 deepseek 进了自动选择（有标定和价格）；其余几家要 --provider/--to 显式指定，标定之前不参与自动选择。
# 经 Claude Code 的都加 --bare：只认 ANTHROPIC_API_KEY（x-api-key），不读你的 Claude 登录。
# 核对日期 2026-10-24，来源见每家注释。

[providers.deepseek]          # api-docs.deepseek.com（Claude Code 接入页）
agent = "claude"
models = ["deepseek-flash"]   # deepseek-v4-pro 仍可用 --model 显式指定，但不参与自动选择（评测里比 flash 弱、更贵）
env = { ANTHROPIC_BASE_URL = "https://api.deepseek.com/anthropic", ANTHROPIC_API_KEY = "$DEEPSEEK_API_KEY" }
daily_usd = 1.0

[providers.deepseek-codex]    # api-docs.deepseek.com（Codex 接入页）+ Codex 配置参考（model_providers.<id>）
agent = "codex"
vendor = "deepseek"
models = ["deepseek-flash"]
# Codex 只支持 Responses 接口（wire_api = "responses"）；密钥用 env_key 从环境变量读，不写进 config.toml。
args = ["-c", 'model_provider="deepseek"', "-c", 'model_providers.deepseek.name="DeepSeek"',
        "-c", 'model_providers.deepseek.base_url="https://api.deepseek.com/"',
        "-c", 'model_providers.deepseek.env_key="DEEPSEEK_API_KEY"', "-c", 'model_providers.deepseek.wire_api="responses"']
env = { DEEPSEEK_API_KEY = "$DEEPSEEK_API_KEY" }
daily_usd = 1.0

[providers.kimi]              # platform.kimi.ai/docs/guide/claude-code-kimi.md
agent = "claude"
models = ["kimi-k3.1-pro"]
env = { ANTHROPIC_BASE_URL = "https://api.moonshot.ai/anthropic", ANTHROPIC_API_KEY = "$MOONSHOT_API_KEY" }
daily_usd = 1.0
# 价格页的表格是网页脚本渲染的，没读到数字：先在这里写上 prices."kimi-k3.1-pro"，否则会拒绝运行（守不住 daily_usd）。

[providers.glm]               # docs.z.ai（Anthropic Messages 端点；价格页 guides/overview/pricing）
agent = "claude"
models = ["glm-5.3-flash"]
env = { ANTHROPIC_BASE_URL = "https://api.z.ai/api/anthropic", ANTHROPIC_API_KEY = "$ZAI_API_KEY" }
daily_usd = 1.0
prices."glm-5.3-flash" = { input = 0.15, cached = 0.03, output = 0.50 }
prices."glm-5.3" = { input = 1.4, cached = 0.26, output = 4.4 }

[providers.qwen]              # alibabacloud.com/help/en/model-studio/claude-code（按量付费）
agent = "claude"
models = ["qwen3.7-plus"]
# 按量付费的地址带你的工作空间 ID，按地域不同：https://{WorkspaceId}.ap-southeast-1.maas.aliyuncs.com/apps/anthropic 等，
# 所以从环境变量 DASHSCOPE_ANTHROPIC_BASE_URL 读；密钥要和地域对应。
env = { ANTHROPIC_BASE_URL = "$DASHSCOPE_ANTHROPIC_BASE_URL", ANTHROPIC_API_KEY = "$DASHSCOPE_API_KEY" }
daily_usd = 1.0
# 国际（新加坡）最低档价格；页面没给缓存价，cached 按 input 算（偏高，宁可多算）。
prices."qwen3.7-plus" = { input = 0.4, cached = 0.4, output = 1.6 }
prices."qwen3.7-max" = { input = 2.5, cached = 2.5, output = 7.5 }

[providers.openrouter]        # openrouter.ai/docs/guides/guides/claude-code-integration
agent = "claude"
vendor = "openrouter"         # 实际厂商看你选的模型；要让“另一家”判断准，可改成那家（如 "moonshot"）
models = []                   # 没有默认模型：用 --model 指定，并在 prices 里写上它的价格
env = { ANTHROPIC_BASE_URL = "https://openrouter.ai/api", ANTHROPIC_API_KEY = "$OPENROUTER_API_KEY" }
daily_usd = 1.0
